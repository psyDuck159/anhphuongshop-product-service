deploy:
 stage: deploy
 image: bitnamisecure/kubectl:latest
 variables:
   SECRET_NAME: "anhphuongshop-product-service-secrets"
   NAMESPACE: "anhphuongshop"
#    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
#    GIT_DEPTH: "0"
#    SONAR_TOKEN: "sqp_13b02f0e641f4198fdce787fedc51ca515f1ad1c"
 script:
    - echo "192.168.1.123 nexus.anhld.biz" >> /etc/hosts
    - apt-get update -qq && apt-get install -y curl jq
    - |
      cat <<EOF > /tmp/secret.yaml
      apiVersion: v1
      kind: Secret
      metadata:
        name: $SECRET_NAME
        namespace: $NAMESPACE
      type: Opaque
      data:
      $(curl --header "X-Vault-Token: ${VAULT_ID_TOKEN}" --request GET https://vaultdell.anhld.biz/v1/kv/data/anhphuongshop/product-service | jq -r '.data.data | to_entries[] | "  \(.key): \(.value | @base64) "')
      EOF

    - kubectl apply -f /tmp/secret.yaml
    - kubectl set image deployment/anhphuongshop-product-service-deployment anhphuongshop-product-service=$DOCKER_IMAGE -n anhphuongshop
 tags:
    - shared-runner-2
