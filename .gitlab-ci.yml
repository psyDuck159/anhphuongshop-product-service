  image: docker:20-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: docker:20-dind
      alias: docker
      command: ["--tls=false"]
  script:
    # - docker info
    - apk add docker-buildx-plugin
    - echo "192.168.1.123 vaultdell.anhld.biz" >> /etc/hosts
    - echo "192.168.1.123 nexus.anhld.biz" >> /etc/hosts
    - ip a
    - chmod +x mvnw  # Ensure executable
    - DOCKER_BUILDKIT=1 docker build --build-arg NEXUS_USER="$NEXUS_USER" --build-arg NEXUS_PASS="$NEXUS_PASS" --add-host nexus.anhld.biz:192.168.1.123 -t $DOCKER_IMAGE .
    # - apk add --no-cache curl jq

    - echo "$HARBOR_PW" | docker login -u "$HARBOR_USER" --password-stdin "$HARBOR_URL"
    - docker push $DOCKER_IMAGE
  tags:
    - shared-runner-2
